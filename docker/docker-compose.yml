# VSKit development test services: postgres, mysql, mssql.
# These standalone fixture identifiers and volumes are independent of other
# local development databases.
# TASK-003 created these fixtures for TASK-004/005/006; keep IDs VSKit-specific.
#
# Khởi động:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down
#
# Health check: mỗi service có healthcheck; `pg_isready`, `mysqladmin ping`,
# `/opt/mssql-tools18/bin/sqlcmd -C -No`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: VSKit-postgres
    environment:
      POSTGRES_USER: VSKit
      POSTGRES_PASSWORD: VSKitDevPg_2026!
      POSTGRES_DB: VSKit
    ports:
      - "5433:5432"
    volumes:
      - VSKit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U VSKit -d VSKit"]
      interval: 3s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    container_name: VSKit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: VSKitDevMysqlRoot_2026!
      MYSQL_DATABASE: VSKit
      MYSQL_USER: VSKit
      MYSQL_PASSWORD: VSKitDevMysql_2026!
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - VSKit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "VSKit", "-pVSKitDevMysql_2026!"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: VSKit-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "VSKitDevSql_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - VSKit_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'VSKitDevSql_2026!' -C -No -Q 'SELECT 1' || exit 1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  VSKit_pg_data:
  VSKit_mysql_data:
  VSKit_mssql_data: